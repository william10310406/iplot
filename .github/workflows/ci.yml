name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -rs --cov=core --cov-report=term
      # 不要設 PYTHONIOENCODING：它會傳給測試開的子行程，藏住「把中文印到 cp1252／cp950 管線就崩潰」的 bug，真的 Windows 使用者不會設它（所以 Windows log 的 -rs 理由是 \u 跳脫）
      - if: runner.os != 'Linux'
        run: python -m pytest -q -rs --cov=core --cov-report=term
      - if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a python tests/smoke.py
      - if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: python tests/smoke.py
