[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/original"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "BLE", "S102", "S605", "S602"]

[tool.ruff.lint.per-file-ignores]
# docs/09 格式的作業檔：第二行 import hk_page; hk_page.ensure(…) 先裝好套件才 import 別的，固定尾段的 import sys 在檔尾
"modules/科學計算/examples/*.py" = ["E402", "E702", "I001"]
"modules/課程作業/作業類型/*/範本.py" = ["E402", "E702", "I001"]
"modules/課程作業/範例課程/**/*.py" = ["E402", "E702", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# 量核心、面板、main.py 與隨附模組（D160 第 5 條）；基準在 tools/coverage-baseline.json，只准持平或上升（tools/check_coverage.py）。
# 不量的：科學計算、課程作業、Lean（不是隨附模組），與另開的子程序（它們跑的是同一份程式碼，量到的會重複）
source = ["core", "ui", "main", "modules"]
omit = ["modules/科學計算/*", "modules/課程作業/*", "modules/Lean/*", "*/tests/*"]
